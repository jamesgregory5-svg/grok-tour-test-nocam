<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Tour Sim test: no cameras (v1.13.1 candidate)</title><script src="auth.js"></script>
<style>
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 0%,#17352a,#0a1511 70%);color:#f1ece0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{min-height:100%;display:grid;place-items:center;padding:20px;box-sizing:border-box}
.c{width:min(380px,100%);background:#0f1d17cc;border:1px solid #ffffff22;border-radius:18px;padding:26px;text-align:center;box-shadow:0 20px 60px #0008}
h1{margin:0 0 4px;font-size:22px}p{margin:0 0 18px;color:#b9c9bf;font-size:14px}
.r{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px 14px;border-radius:999px;border:1px solid #ffffff33;background:#0007;color:#fff;font-size:16px}
button{padding:12px 20px;border-radius:999px;border:0;background:#f1ece0;color:#0d1f17;font-weight:700;font-size:16px;cursor:pointer}
#e{min-height:20px;margin-top:12px;color:#ff9b8a;font-size:14px}
</style></head><body><div class="w"><form class="c" id="f"><h1>Tour Sim test: no cameras (v1.13.1 candidate)</h1><p>Classic camera only, Modern Clean title, putt aim fix</p><div class="r"><input id="p" type="password" placeholder="Password" autocomplete="current-password" autofocus><button>Unlock</button></div><div id="e"></div></form></div>
<script>
function go(){location.replace('game.html')}
if(GrokAuth.isSignedIn())go();
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();var e=document.getElementById('e');e.textContent='';GrokAuth.enterPassword(document.getElementById('p').value).then(go,function(x){e.textContent=x&&x.message||'Incorrect password.'})});
</script></body></html>
